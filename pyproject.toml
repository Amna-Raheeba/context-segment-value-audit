[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "context-segment-value-audit"
version = "0.1.0"
description = "Prices every segment of an agent's context by its causal leave-one-out effect on task success, and registers the segments whose value is negative."
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
